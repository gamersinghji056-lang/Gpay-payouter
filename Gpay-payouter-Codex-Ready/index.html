)}.readonly{max-width:1360px;margin:auto;padding:28px}.readHead{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.toast{position:fixed;right:18px;bottom:18px;z-index:200;background:#10223a;border:1px solid var(--line);padding:11px 13px;border-radius:12px;box-shadow:var(--shadow)}

<script>
(function(){
"use strict";
var KEY="settleflow_smart_v1", AUTH_KEY="settleflow_admin_auth_v1", RATE_DEFAULT=107, USDT_CONTRACT="TXLAQ63Xg1NAzckPwKHvzw7CSEmLMEqcdj";
var DEMO_ADMIN={username:"admin",password:"admin123"};
function id(p){return p+"_"+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-5)}
function tok(){return id("share")+Math.random().toString(36).slice(2,12)}
function today(){return new Date().toISOString().slice(0,10)}
function nowIso(){return new Date().toISOString()}
function money(n){return "₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2})}

function dateFmt(s){if(!s)return "-";var d=s.length<=10?new Date(s+"T00:00:00"):new Date(s);return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[m]})}

{id:"USR-1001",name:"Aarav Traders",telegram:"@aarav_trade",upi:"aaravbiz@okaxis",mobile:"9876543210",apk:"9876543210",gpayLogin:"aarav.gpay@example.com",gpayPassword:"Demo@123",qrs:[],fundingMode:"commission",limit:500000,depositAddress:"",token:tok(),active:true},
{id:"USR-1002",name:"Nova Services",telegram:"@nova_services",upi:"nova@okhdfcbank",mobile:"9812345678",apk:"9812345678",gpayLogin:"nova.gpay@example.com",gpayPassword:"Nova@456",qrs:[],fundingMode:"deposit",limit:0,depositAddress:"",token:tok(),active:true}],entries:[
{id:id("e"),userId:"USR-1001",type:"collection",bank:"Axis Bank",account:"XXXX7812",amount:200000,date:"2026-08-29",note:"GPay collection",status:"posted",createdAt:nowIso(),enteredBy:"admin"},
{id:id("e"),userId:"USR-1001",type:"inr_received",amount:120000,date:"2026-08-30",note:"Successful withdrawal received",status:"posted",createdAt:nowIso(),enteredBy:"admin"},
{id:id("e"),userId:"USR-1002",type:"collection",bank:"HDFC Bank",account:"XXXX5520",amount:40000,date:"2026-08-30",note:"GPay collection",status:"posted",createdAt:nowIso(),enteredBy:"merchant"}],deposits:[
{id:id("dep"),userId:"USR-1002",requestedUsdt:1000,expectedUsdt:1000,rate:110.21,inrValue:110210,address:"",status:"confirmed",txHash:"DEMO_TX_HASH",createdAt:"2026-08-30T08:00:00.000Z",confirmedAt:"2026-08-30T08:03:00.000Z",source:"demo"}],audit:[]}}
function load(){try{var x=localStorage.getItem(KEY);if(x){var d=JSON.parse(x);migrate(d);return d}}catch(e){}var d=seed();saveRaw(d);return d}
function migrate(d){d.settings=d.settings||{};if(d.settings.rate&&!d.settings.settlementRate)d.settings.settlementRate=d.settings.rate;d.settings.settlementRate=Number(d.settings.settlementRate||107);d.settings.depositBaseRate=Number(d.settings.depositBaseRate||107);d.settings.depositMarkupPct=Number(d.settings.depositMarkupPct==null?3:d.settings.depositMarkupPct);d.settings.commissionRate=Number(d.settings.commissionRate==null?3.5:d.settings.commissionRate);d.settings.merchantToken=d.settings.merchantToken||tok();d.settings.agentToken=d.settings.agentToken||tok();d.settings.adminTrc20Address=d.settings.adminTrc20Address||"";d.settings.tronApiKey=d.settings.tronApiKey||"";d.settings.usdtContract=d.settings.usdtContract||USDT_CONTRACT;d.users=d.users||[];d.entries=d.entries||[];d.deposits=d.deposits||[];d.audit=d.audit||[];d.users.forEach(function(u){u.qrs=u.qrs||[];u.fundingMode=u.fundingMode||"commission";u.limit=Number(u.limit||0);u.depositAddress=u.depositAddress||"";u.token=u.token||tok();if(u.active==null)u.active=true})}
function saveRaw(d){localStorage.setItem(KEY,JSON.stringify(d))}var db=load();function save(noRender){saveRaw(db);if(!noRender)render()}
function audit(action,userId,detail,actor){db.audit.unshift({id:id("audit"),action:action,userId:userId||"",detail:detail||"",actor:actor||"admin",createdAt:nowIso()});if(db.audit.length>500)db.audit=db.audit.slice(0,500)}
function entries(uid){return db.entries.filter(function(e){return e.userId===uid})}function deposits(uid){return db.deposits.filter(function(d){return d.userId===uid})}
function depositRate(){return Number(db.settings.depositBaseRate||107)*(1+Number(db.settings.depositMarkupPct||0)/100)}
function calc(u){var es=entries(u.id),settlementRate=Number(db.settings.settlementRate||RATE_DEFAULT),collection=0,inrReceived=0,userUsdt=0,userUsdtINR=0,merchantSettled=0,merchantSettledINR=0,frozen=0;es.forEach(function(e){if(e.type==="collection")collection+=Number(e.amount||0);if(e.type==="inr_received")inrReceived+=Number(e.amount||0);if(e.type==="user_usdt"){userUsdt+=Number(e.usdt||0);userUsdtINR+=Number(e.usdt||0)*Number(e.rate||settlementRate)}if(e.type==="merchant_usdt"){merchantSettled+=Number(e.usdt||0);merchantSettledINR+=Number(e.usdt||0)*Number(e.rate||settlementRate)}if(e.type==="frozen"&&e.status!=="released")frozen+=Number(e.amount||0)});
var confirmedDeps=deposits(u.id).filter(function(d){return d.status==="confirmed"}),confirmedDepositUsdt=0,confirmedDepositINR=0;confirmedDeps.forEach(function(d){confirmedDepositUsdt+=Number(d.requestedUsdt||d.expectedUsdt||0);confirmedDepositINR+=Number(d.inrValue||0)});
var merchantAvailableINR=Math.max(0,collection-frozen-merchantSettledINR),merchantAvailableUSDT=Math.max(0,merchantAvailableINR/settlementRate);var pending=Math.max(0,collection-inrReceived-userUsdtINR-frozen);var holding=Math.max(0,collection-inrReceived-userUsdtINR);var commissionEarned=u.fundingMode==="commission"?inrReceived*(Number(db.settings.commissionRate||3.5)/100):0;
var exposure=Math.max(0,collection-inrReceived);var collectionCapacity=u.fundingMode==="deposit"?Math.max(0,confirmedDepositINR-collection):Math.max(0,Number(u.limit||0)-exposure);var consumed=u.fundingMode==="deposit"?collection:exposure;var capBase=u.fundingMode==="deposit"?confirmedDepositINR:Number(u.limit||0);var capPct=capBase?Math.min(100,(consumed/capBase)*100):0;
return {collection:collection,inrReceived:inrReceived,userUsdt:userUsdt,userUsdtINR:userUsdtINR,merchantSettled:merchantSettled,merchantSettledINR:merchantSettledINR,frozen:frozen,merchantAvailableINR:merchantAvailableINR,merchantAvailableUSDT:merchantAvailableUSDT,pending:pending,holding:holding,commissionEarned:commissionEarned,confirmedDepositUsdt:confirmedDepositUsdt,confirmedDepositINR:confirmedDepositINR,collectionCapacity:collectionCapacity,consumed:consumed,capBase:capBase,capPct:capPct,settlementRate:settlementRate}}
function totals(){var t={collection:0,capacity:0,frozen:0,pending:0,commission:0,deposits:0};db.users.forEach(function(u){var c=calc(u);t.collection+=c.collection;t.capacity+=c.collectionCapacity;t.frozen+=c.frozen;t.pending+=c.pending;t.commission+=c.commissionEarned;t.deposits+=c.confirmedDepositUsdt});return t}

function modal(html){document.getElementById("modalRoot").innerHTML='<div class="modal" onclick="if(event.target===this)SF.close()">'+html+'</div>'}function close(){document.getElementById("modalRoot").innerHTML=""}
function isAdminLoggedIn(){return sessionStorage.getItem(AUTH_KEY)==="1"}function loginScreen(msg){document.getElementById("app").innerHTML='<div class="loginGate"><div class="loginCard"><div class="logo"><div class="logoMark">◆</div><div>SettleFlow<div class="muted" style="font-size:11px">Secure Admin Access</div></div></div><h1>Admin Login</h1><p class="muted">Sign in to manage users, limits, ledger and deposits.</p>'+(msg?'<div class="notice">'+esc(msg)+'</div>':'')+'<form onsubmit="event.preventDefault();SF.login()"><div class="field"><label>Username</label><input id="loginUser" autocomplete="username"></div><div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password"></div><button class="btn primary" style="width:100%;margin-top:12px" type="submit">Login to Admin</button></form><div class="securityNote">Prototype: <b>admin</b> / <b>admin123</b>. Production must use Supabase Auth, RLS, server-side credential encryption and a backend TRON watcher.</div></div></div>'}
function login(){if(v("loginUser")===DEMO_ADMIN.username&&v("loginPass")===DEMO_ADMIN.password){sessionStorage.setItem(AUTH_KEY,"1");location.hash="#admin";render();toast("Logged in")}else loginScreen("Invalid username or password.")}function logout(){sessionStorage.removeItem(AUTH_KEY);location.hash="#admin";loginScreen("Logged out.")}
function admin(){if(!isAdminLoggedIn())return loginScreen();var t=totals();document.getElementById("app").innerHTML='<div class="shell"><aside class="side"><div class="logo"><div class="logoMark">◆</div><div>SettleFlow<div class="muted" style="font-size:11px">GPay Control Center</div></div></div><div class="nav"><button class="active" onclick="SF.nav(\'dashboard\',this)">Dashboard</button><button onclick="SF.nav(\'users\',this)">Users</button><button onclick="SF.nav(\'ledger\',this)">Ledger</button><button onclick="SF.nav(\'deposits\',this)">Deposits</button><button onclick="SF.nav(\'share\',this)">Sharing</button></div><div class="sideBottom"><div class="rateBox">Merchant Settlement<br><b>'+db.settings.settlementRate+' INR = 1 USDT</b></div><div class="rateBox">Deposit Credit Rate<br><b>1 USDT = '+money(depositRate())+'</b><br><span class="muted">107 + 3%</span></div></div></aside><main class="main"><div class="top"><div><h1 id="title">Operations Dashboard</h1><div class="muted">Smart Deposit + Commission capacity prototype</div></div><div class="actions"><button class="btn ghost" onclick="SF.settings()">System Settings</button><button class="btn red" onclick="SF.logout()">Logout</button><button class="btn primary" onclick="SF.addUser()">+ Add User</button></div></div><section id="dashboard" class="section active"><div class="kpis">'+kpi("TOTAL COLLECTION",money(t.collection),"All cards")+kpi("AVAILABLE CAPACITY",money(t.capacity),"Safe next collection")+kpi("CONFIRMED DEPOSITS",usdt(t.deposits),"Deposit users")+kpi("FROZEN",money(t.frozen),"Current blocked")+kpi("PENDING FROM USERS",money(t.pending),"Recovery")+'</div><div class="toolbar"><div><h2>User Cards</h2><div class="muted">Deposit users refill with USDT; commission users refill after successful withdrawal</div></div><input class="search" placeholder="Search name / UPI / mobile" oninput="SF.searchCards(this.value)"></div><div id="cards" class="grid"></div></section><section id="users" class="section"><div class="toolbar"><div><h2>Users</h2><div class="muted">Profiles, mode and admin-only capacity settings</div></div></div><div id="usersTable"></div></section><section id="ledger" class="section"><div class="toolbar"><div><h2>Master Ledger</h2><div class="muted">Operational entries and correction history</div></div></div><div id="ledgerTable"></div></section><section id="deposits" class="section"><div class="toolbar"><div><h2>TRC20 Deposits</h2><div class="muted">Created, detected and confirmed USDT deposits</div></div><button class="btn blue" onclick="SF.checkAllDeposits(true)">Check Blockchain Now</button></div><div id="depositTable"></div></section><section id="share" class="section"><div class="toolbar"><div><h2>Sharing</h2><div class="muted">Common Merchant/Agent links and individual User links</div></div></div><div id="shareBody"></div></section></main></div>';fillAdminTables();searchCards("")}
function nav(name,b){document.querySelectorAll(".section").forEach(function(x){x.classList.remove("active")});document.getElementById(name).classList.add("active");document.querySelectorAll(".nav button").forEach(function(x){x.classList.remove("active")});b.classList.add("active");document.getElementById("title").textContent={dashboard:"Operations Dashboard",users:"Users",ledger:"Master Ledger",deposits:"TRC20 Deposits",share:"Sharing"}[name]||"SettleFlow"}
function searchCards(q){var el=document.getElementById("cards");if(!el)return;q=(q||"").toLowerCase();var arr=db.users.filter(function(u){return u.active!==false&&(u.name+" "+u.upi+" "+u.mobile+" "+u.telegram).toLowerCase().indexOf(q)>-1});el.innerHTML=arr.length?arr.map(function(u){return card(u,false)}).join(""):'<div class="empty">No users</div>'}
function fillAdminTables(){var ut=document.getElementById("usersTable"),lt=document.getElementById("ledgerTable"),dt=document.getElementById("depositTable"),sb=document.getElementById("shareBody");if(ut)ut.innerHTML='<div class="tableWrap"><table><thead><tr><th>User</th><th>Mode</th><th>Collection</th><th>Available Capacity</th><th>Admin Limit</th><th>Deposit Value</th><th>Pending</th><th>Action</th></tr></thead><tbody>'+db.users.map(function(u){var c=calc(u);return '<tr><td><b>'+esc(u.name)+'</b><br><span class="muted">'+esc(u.id)+'</span></td><td>'+modePill(u)+'</td><td>'+money(c.collection)+'</td><td><b>'+money(c.collectionCapacity)+'</b></td><td>'+(u.fundingMode==="commission"?money(u.limit):'<span class="muted">Deposit driven</span>')+'</td><td>'+money(c.confirmedDepositINR)+'</td><td>'+money(c.pending)+'</td><td><button class="btn primary sm" onclick="SF.openUser(\''+u.id+'\')">Open</button></td></tr>'}).join("")+'</tbody></table></div>';
if(lt){var all=db.entries.slice().sort(function(a,b){return String(b.date||"").localeCompare(String(a.date||""))});lt.innerHTML='<div class="tableWrap"><table><thead><tr><th>Date</th><th>User</th><th>Type</th><th>Amount</th><th>Rate</th><th>Bank / Ref</th><th>Entered By</th></tr></thead><tbody>'+all.map(function(e){var u=db.users.find(function(x){return x.id===e.userId});return '<tr><td>'+dateFmt(e.date)+'</td><td>'+esc(u?u.name:e.userId)+'</td><td>'+esc(label(e.type))+'</td><td>'+(e.usdt?usdt(e.usdt):money(e.amount))+'</td><td>'+(e.rate?money(e.rate):'-')+'</td><td>'+esc((e.bank||"")+(e.account?" / "+e.account:"")+(e.note?" • "+e.note:""))+'</td><td>'+esc(e.enteredBy||"admin")+'</td></tr>'}).join("")+'</tbody></table></div>'}
if(dt){var arr=db.deposits.slice().sort(function(a,b){return String(b.createdAt||"").localeCompare(String(a.createdAt||""))});dt.innerHTML=arr.length?'<div class="tableWrap"><table><thead><tr><th>Created</th><th>User</th><th>USDT</th><th>Rate</th><th>INR Credit</th><th>Address</th><th>Status</th><th>TX Hash</th><th>Action</th></tr></thead><tbody>'+arr.map(function(d){var u=db.users.find(function(x){return x.id===d.userId});return '<tr><td>'+dateFmt(d.createdAt)+'</td><td>'+esc(u?u.name:d.userId)+'</td><td>'+usdt(d.requestedUsdt)+'</td><td>'+money(d.rate)+'</td><td>'+money(d.inrValue)+'</td><td style="max-width:180px;word-break:break-all">'+esc(d.address||"Not configured")+'</td><td><span class="badge '+(d.status==="confirmed"?'green':d.status==="failed"?'red':'amber')+'">'+esc(d.status)+'</span></td><td style="max-width:170px;word-break:break-all">'+esc(d.txHash||"-")+'</td><td>'+(d.status!=="confirmed"?'<button class="btn ghost sm" onclick="SF.checkDeposit(\''+d.id+'\',true)">Check</button> <button class="btn green sm" onclick="SF.simulateConfirm(\''+d.id+'\')">Demo Confirm</button>':'<span class="muted">Confirmed</span>')+'</td></tr>'}).join("")+'</tbody></table></div>':'<div class="empty">No deposits yet.</div>'}
if(sb)sb.innerHTML='<div class="box" style="padding:16px"><h3>Merchant Common Link</h3><div class="shareLine"><input readonly value="'+esc(merchantLink())+'"><button class="btn sm" onclick="SF.copy(\''+esc(merchantLink())+'\')">Copy</button><button class="btn primary sm" onclick="window.open(\''+esc(merchantLink())+'\',\'_blank\')">Open</button><button class="btn amber sm" onclick="SF.regen(\'merchant\')">Regenerate</button></div><h3 style="margin-top:20px">Agent Common Link</h3><div class="shareLine"><input readonly value="'+esc(agentLink())+'"><button class="btn sm" onclick="SF.copy(\''+esc(agentLink())+'\')">Copy</button><button class="btn primary sm" onclick="window.open(\''+esc(agentLink())+'\',\'_blank\')">Open</button><button class="btn amber sm" onclick="SF.regen(\'agent\')">Regenerate</button></div><h3 style="margin-top:20px">Individual User Links</h3>'+db.users.map(function(u){return '<div class="shareLine"><input readonly value="'+esc(userLink(u))+'"><span style="min-width:130px;font-size:12px">'+esc(u.name)+'</span><button class="btn sm" onclick="SF.copyUser(\''+u.id+'\')">Copy</button><button class="btn amber sm" onclick="SF.regenUser(\''+u.id+'\')">Regenerate</button></div>'}).join("")+'</div>'}
function addUser(){modal('<div class="modalBox small"><div class="modalHead"><div><b>Create User Card</b><div class="muted" style="font-size:12px">Name, Telegram and funding model are required.</div></div><button class="btn ghost sm" onclick="SF.close()">✕</button></div><div class="modalBody"><div class="form">'+field("User Name","newName","")+field("Telegram Username","newTg","")+selectField("Funding Model","newMode",[["deposit","Deposit Based"],["commission","Commission Based (3.5%)"]],"deposit")+'<div class="field full"><div class="notice green"><b>Deposit Based:</b> confirmed TRC20 USDT creates collection capacity at the configured deposit rate.<br><b>Commission Based:</b> Admin assigns the internal limit and the user earns commission on successful INR withdrawals.</div></div></div></div><div class="modalFoot"><button class="btn primary" onclick="SF.createUser()">Create Card</button></div></div>')}
function createUser(){var name=v("newName"),tg=v("newTg"),mode=v("newMode");if(!name||!tg)return toast("User Name and Telegram Username required");if(mode!=="deposit"&&mode!=="commission")return toast("Select Deposit Based or Commission Based");var n=1001+db.users.length;while(db.users.some(function(u){return u.id==="USR-"+n}))n++;var u={id:"USR-"+n,name:name,telegram:tg,upi:"",mobile:"",apk:"",gpayLogin:"",gpayPassword:"",qrs:[],fundingMode:mode,limit:0,depositAddress:"",token:tok(),active:true};db.users.push(u);audit("user_created",u.id,"Created with Name + Telegram • "+(mode==="deposit"?"Deposit Based":"Commission Based"),"admin");close();save();toast((mode==="deposit"?"Deposit Based":"Commission Based")+" user card created")}
function editUser(uid){var u=db.users.find(function(x){return x.id===uid});if(!u)return;modal('<div class="modalBox"><div class="modalHead"><div><b>Edit User / Mode</b><div class="muted" style="font-size:12px">Admin can configure remaining card details after creation.</div></div><button class="btn ghost sm" onclick="SF.close()">✕</button></div><div class="modalBody"><div class="form">'+field("User Name","uName",u.name)+field("Telegram Username","uTg",u.telegram)+field("UPI ID","uUpi",u.upi)+field("Mobile Number","uMob",u.mobile)+field("APK Mobile Number","uApk",u.apk)+field("GPay Login ID","uGpayLogin",u.gpayLogin)+field("GPay Password","uGpayPassword",u.gpayPassword)+selectField("Funding Model","uMode",[["commission","Commission Based — 3.5%"],["deposit","Deposit Based — USDT prepaid"]],u.fundingMode)+field("Admin Maximum Limit (Commission Mode)","uLimit",u.limit,"number")+field("Unique TRC20 Deposit Address (optional)","uDepositAddress",u.depositAddress||"")+'<div class="field full"><div class="notice">Deposit users use the unique address above when set; otherwise the global Admin TRC20 address is used. For production auto-matching, a unique address per user is recommended.</div></div></div></div><div class="modalFoot"><button class="btn primary" onclick="SF.saveUser(\''+uid+'\')">Save User</button></div></div>')}
function saveUser(uid){var u=db.users.find(function(x){return x.id===uid});if(!u)return;var before=JSON.stringify({name:u.name,telegram:u.telegram,mode:u.fundingMode,limit:u.limit,addr:u.depositAddress});u.name=v("uName");u.telegram=v("uTg");u.upi=v("uUpi");u.mobile=v("uMob");u.apk=v("uApk");u.gpayLogin=v("uGpayLogin");u.gpayPassword=v("uGpayPassword");u.fundingMode=v("uMode")||"commission";u.limit=Math.max(0,Number(v("uLimit")||0));u.depositAddress=v("uDepositAddress");audit("user_updated",uid,"Before: "+before,"admin");close();save();toast("User updated")}
function setCommissionLimit(uid){var u=db.users.find(function(x){return x.id===uid});if(!u)return;if(u.fundingMode!=="commission")return toast("Maximum limit applies only to Commission Based users");var c=calc(u);modal('<div class="modalBox small"><div class="modalHead"><div><b>Set Commission User Limit</b><div class="muted" style="font-size:12px">Admin-only capacity control for '+esc(u.name)+'</div></div><button class="btn ghost sm" onclick="SF.close()">✕</button></div><div class="modalBody">'+field("Maximum Collection Limit INR","commissionLimit",u.limit,"number")+'<div class="notice" style="margin-top:12px">Current collection: <b>'+money(c.collection)+'</b><br>Successful withdrawal: <b>'+money(c.inrReceived)+'</b><br>Current available: <b>'+money(c.collectionCapacity)+'</b><br><br>This limit is never shown to Merchant, Agent or the User.</div></div><div class="modalFoot"><button class="btn primary" onclick="SF.saveCommissionLimit(\''+uid+'\')">Save Limit</button></div></div>')}
function saveCommissionLimit(uid){var u=db.users.find(function(x){return x.id===uid});if(!u||u.fundingMode!=="commission")return;var n=Number(v("commissionLimit")||0);if(n<0)return toast("Enter a valid limit");var old=Number(u.limit||0);u.limit=n;audit("commission_limit_updated",uid,"From "+money(old)+" to "+money(n),"admin");close();save();toast("Commission user limit updated")}
function settings(){modal('<div class="modalBox"><div class="modalHead"><div><b>System Settings</b><div class="muted" style="font-size:12px">Settlement, deposit credit, commission and TRON watcher configuration.</div></div><button class="btn ghost sm" onclick="SF.close()">✕</button></div><div class="modalBody"><div class="form">'+field("Merchant Settlement Rate INR / USDT","sSettlement",db.settings.settlementRate,"number")+field("Deposit Base Rate INR / USDT","sBase",db.settings.depositBaseRate,"number")+field("Deposit Markup %","sMarkup",db.settings.depositMarkupPct,"number")+field("Commission % on Successful INR Withdrawal","sCommission",db.settings.commissionRate,"number")+field("Global Admin TRC20 Address","sAddress",db.settings.adminTrc20Address)+field("TRON USDT Contract","sContract",db.settings.usdtContract||USDT_CONTRACT)+field("TronGrid API Key (prototype only)","sTronKey",db.settings.tronApiKey)+ '<div class="field"><label>Calculated Deposit Rate</label><input disabled value="'+money(depositRate())+' / USDT"></div><div class="field full"><div class="notice amber"><b>Production security:</b> do not expose TronGrid API keys, GPay encryption keys or service-role keys in browser code. Run the blockchain watcher and credential decryption on a trusted backend/worker.</div></div></div></div><div class="modalFoot"><button class="btn primary" onclick="SF.saveSettings()">Save Settings</button></div></div>')}
function saveSettings(){db.settings.settlementRate=Math.max(.01,Number(v("sSettlement")||107));db.settings.depositBaseRate=Math.max(.01,Number(v("sBase")||107));db.settings.depositMarkupPct=Math.max(0,Number(v("sMarkup")||3));db.settings.commissionRate=Math.max(0,Number(v("sCommission")||3.5));db.settings.adminTrc20Address=v("sAddress");db.settings.usdtContract=v("sContract")||USDT_CONTRACT;db.settings.tronApiKey=v("sTronKey");audit("settings_updated","","Rates / TRON settings updated","admin");close();save();toast("Settings saved")}
function credentialHTML(u,copyAllowed){return '<div class="credGrid"><div class="credBox"><span>GPay Login ID</span><div class="credValue"><code>'+esc(u.gpayLogin||"-")+'</code>'+(copyAllowed&&u.gpayLogin?'<button class="btn ghost sm" onclick="SF.copy(\''+esc(u.gpayLogin)+'\')">Copy</button>':'')+'</div></div><div class="credBox"><span>GPay Password</span><div class="credValue"><code id="pw_'+u.id+'">••••••••</code>'+(u.gpayPassword?'<button class="btn ghost sm" onclick="SF.togglePass(\''+u.id+'\')">Show/Hide</button>':'')+(copyAllowed&&u.gpayPassword?'<button class="btn ghost sm" onclick="SF.copy(\''+esc(u.gpayPassword)+'\')">Copy</button>':'')+'</div><div class="auditLine">Prototype plaintext only. Production must decrypt server-side and audit reveals.</div></div></div>'}
function togglePass(uid){var u=db.users.find(function(x){return x.id===uid}),e=document.getElementById("pw_"+uid);if(!u||!e)return;e.textContent=e.textContent.indexOf("•")>-1?(u.gpayPassword||"-"):"••••••••";audit("credential_reveal",uid,"GPay password revealed in prototype",currentSharedRole||"admin");save(true)}
function qrHTML(u,editable){u.qrs=u.qrs||[];if(!u.qrs.length)return '<div class="empty">No GPay QR codes uploaded.</div>';return '<div class="qrGrid">'+u.qrs.map(function(q,i){return '<div class="qrItem"><img src="'+q.data+'" alt="QR"><div class="qrName">'+esc(q.name||("QR "+(i+1)))+'</div><div class="qrActions"><button class="btn ghost sm" onclick="SF.openQR(\''+u.id+'\','+i+')">Open</button>'+(editable?'<button class="btn red sm" onclick="SF.removeQR(\''+u.id+'\','+i+')">Remove</button>':'')+'</div></div>'}).join("")+'</div>'}
function uploadQR(uid){var input=document.createElement("input");input.type="file";input.accept="image/*";input.multiple=true;input.onchange=function(){var u=db.users.find(function(x){return x.id===uid});Array.from(input.files||[]).forEach(function(f){var r=new FileReader();r.onload=function(){u.qrs=u.qrs||[];u.qrs.push({name:f.name,data:r.result,createdAt:nowIso()});audit("qr_uploaded",uid,f.name,currentSharedRole||"admin");save(true);render();toast("QR uploaded")};r.readAsDataURL(f)})};input.click()}
function removeQR(uid,i){var u=db.users.find(function(x){return x.id===uid});if(!u||!u.qrs[i])return;var n=u.qrs[i].name;u.qrs.splice(i,1);audit("qr_removed",uid,n,currentSharedRole||"admin");save();toast("QR removed")}

ass="btn sm" onclick="SF.copy(\''+esc(agentLink())+'\')">Copy</button></div></div></div></div>')}

function saveCollection(uid,actor){var u=db.users.find(function(x){return x.id===uid}),c=calc(u),amount=Number(v("cAmount")||0),bank=v("cBank"),account=v("cAccount"),date=v("cDate"),note=v("cNote");if(amount<=0)return toast("Enter valid collection amount");if(!bank||!account)return toast("Bank and account required");if(!date)return toast("Date required");if(amount>c.collectionCapacity+0.0001)return toast("Collection exceeds available capacity: "+money(c.collectionCapacity));var e={id:id("e"),userId:uid,type:"collection",bank:bank,account:account,amount:amount,date:date,note:note,status:"posted",createdAt:nowIso(),updatedAt:nowIso(),enteredBy:actor};db.entries.push(e);audit("collection_added",uid,money(amount)+" by "+actor,actor);close();save();toast("Collection added")}
function addEntry(uid,type){var title={inr_received:"Record Successful INR Withdrawal",user_usdt:"Record USDT From User",merchant_usdt:"Merchant USDT Settlement",frozen:"Add Frozen Fund"}[type];var x="";if(type==="frozen")x=field("Bank Name","eBank","")+field("Frozen Amount INR","eAmount","","number");else if(type==="inr_received")x=field("Successful INR Withdrawal Received","eAmount","","number");else x=field("USDT Amount","eUsdt","","number")+field("Historical Rate","eRate",db.settings.settlementRate,"number");modal('<div class="modalBox" style="max-width:680px"><div class="modalHead"><b>'+title+'</b><button class="btn ghost sm" onclick="SF.close()">✕</button></div><div class="modalBody"><div class="form">'+x+field("Date","eDate",today(),"date")+'<div class="field full"><label>Note / Reference</label><input id="eNote"></div></div></div><div class="modalFoot"><button class="btn primary" onclick="SF.saveEntry(\''+uid+'\',\''+type+'\')">Save Entry</button></div></div>')}
function saveEntry(uid,type){var e={id:id("e"),userId:uid,type:type,date:v("eDate"),note:v("eNote"),status:"posted",createdAt:nowIso(),updatedAt:nowIso(),enteredBy:"admin"};if(type==="inr_received"||type==="frozen"){e.amount=Number(v("eAmount")||0);if(e.amount<=0)return toast("Enter valid amount")}if(type==="frozen"){e.bank=v("eBank");e.status="active";if(!e.bank)return toast("Bank required")}if(type==="user_usdt"||type==="merchant_usdt"){e.usdt=Number(v("eUsdt")||0);e.rate=Number(v("eRate")||db.settings.settlementRate);if(e.usdt<=0||e.rate<=0)return toast("Enter valid USDT and rate")}db.entries.push(e);audit(type+"_added",uid,(e.usdt?usdt(e.usdt):money(e.amount)),"admin");close();save();toast("Entry saved")}
function editEntry(eid){var e=db.entries.find(function(x){return x.id===eid});if(!e)return;var fields="";if(e.type==="collection")fields=field("Bank Name","eeBank",e.bank||"")+field("Account Number","eeAccount",e.account||"")+field("Amount INR","eeAmount",e.amount||0,"number");else if(e.type==="frozen")fields=field("Bank Name","eeBank",e.bank||"")+field("Frozen Amount INR","eeAmount",e.amount||0,"number");else if(e.type==="inr_received")fields=field("INR Amount","eeAmount",e.amount||0,"number");else fields=field("USDT Amount","eeUsdt",e.usdt||0,"number")+field("Historical Rate","eeRate",e.rate||db.settings.settlementRate,"number");modal('<div class="modalBox" style="max-width:680px"><div class="modalHead"><b>Edit '+esc(label(e.type))+'</b><button class="btn ghost sm" onclick="SF.close()">✕</button></div><div class="modalBody"><div class="form">'+fields+field("Date","eeDate",e.date,"date")+'<div class="field full"><label>Correction Reason / Note</label><input id="eeNote" value="'+esc(e.note||"")+'"></div></div></div><div class="modalFoot"><button class="btn primary" onclick="SF.updateEntry(\''+eid+'\')">Save Correction</button></div></div>')}
function updateEntry(eid){var e=db.entries.find(function(x){return x.id===eid});if(!e)return;var old=e.usdt!=null?Number(e.usdt):Number(e.amount||0);e.date=v("eeDate");e.note=v("eeNote");if(e.type==="collection"||e.type==="inr_received"||e.type==="frozen")e.amount=Math.max(0,Number(v("eeAmount")||0));if(e.type==="collection"){e.bank=v("eeBank");e.account=v("eeAccount")}if(e.type==="frozen")e.bank=v("eeBank");if(e.type==="user_usdt"||e.type==="merchant_usdt"){e.usdt=Math.max(0,Number(v("eeUsdt")||0));e.rate=Math.max(.01,Number(v("eeRate")||db.settings.settlementRate))}e.previousAmount=old;e.updatedAt=nowIso();e.updatedBy="admin";audit("ledger_corrected",e.userId,label(e.type)+" corrected from "+old,"admin");close();save();toast("Correction saved")}

function createDepositPage(uid){var u=db.users.find(function(x){return x.id===uid});if(!u||u.fundingMode!=="deposit")return toast("Deposit mode required");var addr=u.depositAddress||db.settings.adminTrc20Address||"";modal('<div class="modalBox"><div class="modalHead"><div><b>Create USDT Deposit</b><div class="muted" style="font-size:12px">TRC20 • 1 USDT = '+money(depositRate())+'</div></div><button class="btn ghost sm" onclick="SF.close()">✕</button></div><div class="modalBody"><div class="depositHero"><div class="depositPanel"><h2 style="margin-top:0">Enter Deposit Amount</h2>'+field("USDT Amount","depAmount","","number")+'<div class="notice green" style="margin-top:12px">Every confirmed 1 USDT adds <b>'+money(depositRate())+'</b> to your collection balance.</div><div class="cardActions"><button class="btn primary" onclick="SF.generateDeposit(\''+uid+'\')">Generate Deposit QR</button></div><div class="securityNote">Blockchain confirmation is automatic when the watcher can query TronGrid. This standalone prototype also includes a Demo Confirm button for testing.</div></div><div class="depositPanel depositQR"><div style="text-align:center"><div class="muted">Deposit address</div><div style="font-size:13px;margin-top:8px;word-break:break-all">'+esc(addr||"Admin has not configured a TRC20 address yet.")+'</div></div></div></div></div></div>')}
function generateDeposit(uid){var u=db.users.find(function(x){return x.id===uid}),amount=Number(v("depAmount")||0),addr=u.depositAddress||db.settings.adminTrc20Address||"";if(amount<=0)return toast("Enter valid USDT amount");if(!addr)return toast("Admin must configure a TRC20 address first");var rate=depositRate(),d={id:id("dep"),userId:uid,requestedUsdt:amount,expectedUsdt:amount,rate:rate,inrValue:amount*rate,address:addr,status:"waiting",txHash:"",createdAt:nowIso(),confirmedAt:"",source:"user"};db.deposits.push(d);audit("deposit_created",uid,usdt(amount)+" at "+money(rate),"user");save(true);showDepositRequest(d.id);startWatcher()}

function showDepositRequest(did){var d=db.deposits.find(function(x){return x.id===did}),u=db.users.find(function(x){return x.id===d.userId});if(!d)return;modal('<div class="modalBox"><div class="modalHead"><div><b>Deposit Request</b><div class="muted" style="font-size:12px">'+esc(u?u.name:d.userId)+' • '+esc(d.id)+'</div></div><button class="btn ghost sm" onclick="SF.close()">✕</button></div><div class="modalBody"><div class="depositHero"><div class="depositPanel"><div class="muted">Send exactly</div><div class="depositAmount">'+usdt(d.expectedUsdt)+'</div><div class="muted">Credit after confirmation</div><div style="font-size:22px;font-weight:900;margin:5px 0 16px">'+money(d.inrValue)+'</div><div class="addressBox">'+esc(d.address)+'</div><div class="cardActions"><button class="btn ghost" onclick="SF.copy(\''+esc(d.address)+'\',\'Address copied\')">Copy Address</button><button class="btn ghost" onclick="SF.copy(\''+d.expectedUsdt+'\',\'Amount copied\')">Copy Amount</button></div><div class="notice" style="margin-top:14px"><span class="statusDot '+(d.status==="confirmed"?'confirmed':'')+'"></span>Status: <b>'+esc(d.status.toUpperCase())+'</b>'+(d.txHash?'<br>TX: '+esc(d.txHash):'')+'</div><div class="cardActions"><button class="btn blue" onclick="SF.checkDeposit(\''+d.id+'\',true)">Check Blockchain</button>'+(d.status!=="confirmed"?'<button class="btn green" onclick="SF.simulateConfirm(\''+d.id+'\')">Demo Confirm</button>':'')+'</div></div><div class="depositPanel depositQR"><div><img src="'+qrUrl(d)+'" alt="Deposit QR"><div class="muted" style="text-align:center;margin-top:10px">TRC20 deposit QR</div></div></div></div></div></div>')}
async function checkDeposit(did,manual){var d=db.deposits.find(function(x){return x.id===did});if(!d||d.status==="confirmed")return;if(!d.address){if(manual)toast("No deposit address");return}try{d.status="checking";save(true);var url="https://api.trongrid.io/v1/accounts/"+encodeURIComponent(d.address)+"/transactions/trc20?only_confirmed=true&limit=100&contract_address="+encodeURIComponent(db.settings.usdtContract||USDT_CONTRACT);var headers={};if(db.settings.tronApiKey)headers["TRON-PRO-API-KEY"]=db.settings.tronApiKey;var res=await fetch(url,{headers:headers});if(!res.ok)throw new Error("TronGrid HTTP "+res.status);var js=await res.json(),data=js.data||[],createdMs=new Date(d.createdAt).getTime()-5*60*1000,used={};db.deposits.filter(function(x){return x.txHash&&x.id!==d.id}).forEach(function(x){used[x.txHash]=1});var match=data.find(function(tx){var dec=Number((tx.token_info&&tx.token_info.decimals)||6),val=Number(tx.value||0)/Math.pow(10,dec),ts=Number(tx.block_timestamp||0),to=String(tx.to||"");return !used[tx.transaction_id]&&to===d.address&&ts>=createdMs&&Math.abs(val-Number(d.expectedUsdt))<0.000001});if(match){d.status="confirmed";d.txHash=match.transaction_id;d.confirmedAt=nowIso();d.source="trongrid";audit("deposit_confirmed",d.userId,usdt(d.expectedUsdt)+" tx "+d.txHash,"blockchain");save();if(manual)toast("Deposit confirmed automatically")}else{d.status="waiting";save(true);if(manual){toast("No matching confirmed deposit found");showDepositRequest(d.id)}}}catch(err){d.status="waiting";save(true);if(manual)toast("Blockchain check unavailable: "+err.message)}}
function checkAllDeposits(manual){db.deposits.filter(function(d){return d.status!=="confirmed"}).forEach(function(d){checkDeposit(d.id,false)});if(manual)toast("Blockchain checks started")}
function simulateConfirm(did){var d=db.deposits.find(function(x){return x.id===did});if(!d||d.status==="confirmed")return;d.status="confirmed";d.txHash="DEMO_"+id("tx");d.confirmedAt=nowIso();d.source="demo";audit("deposit_confirmed_demo",d.userId,usdt(d.expectedUsdt),"demo");close();save();toast("Demo deposit confirmed")}

function sharedDashboard(tokn,role){currentSharedRole=role;var expected=role==="Agent"?db.settings.agentToken:db.settings.merchantToken;if(tokn!==expected)return invalid(role+" link is invalid or revoked.");var t=totals();document.getElementById("app").innerHTML='<div class="readonly"><div class="readHead"><div class="logo"><div class="logoMark">◆</div><div>'+role+' Live Dashboard<div class="muted" style="font-size:11px">'+(role==="Merchant"?'GPay access + collection write':'Read-only GPay access')+'</div></div></div><span class="badge green">● Live</span></div><div class="notice">'+(role==="Merchant"?'Merchant can add Collection and correct Collection Amount only. Available Collection is enforced per card.':'Agent is read-only. GPay credentials and QR codes are visible where permitted.')+'</div><div class="kpis" style="margin-top:15px">'+kpi("TOTAL COLLECTION",money(t.collection),"All visible cards")+kpi("AVAILABLE COLLECTION",money(t.capacity),"Current capacity")+kpi("FROZEN",money(t.frozen),"Current")+kpi("USERS",db.users.filter(function(u){return u.active!==false}).length,"Visible cards")+kpi("DEPOSIT CREDIT RATE",money(depositRate()),"1 USDT")+'</div><div class="toolbar"><div><h2>User Cards</h2><div class="muted">Capacity shown without exposing admin-only configured limit details.</div></div><input class="search" placeholder="Search..." oninput="SF.mSearch(this.value)"></div><div id="mCards" class="grid"></div></div>';mSearch("")}
function merchant(t){sharedDashboard(t,"Merchant")}function agent(t){sharedDashboard(t,"Agent")}function mSearch(q){q=(q||"").toLowerCase();var arr=db.users.filter(function(u){return u.active!==false&&(u.name+" "+u.upi+" "+u.mobile).toLowerCase().indexOf(q)>-1});document.getElementById("mCards").innerHTML=arr.map(function(u){return card(u,true)}).join("")}
function readDetail(uid){var u=db.users.find(function(x){return x.id===uid});if(!u)return;var c=calc(u),es=entries(uid).filter(function(e){return e.type==="collection"}).slice().sort(function(a,b){return String(b.date||"").localeCompare(String(a.date||""))});var merchantControls=currentSharedRole==="Merchant"?'<div class="cardActions" style="margin:16px 0"><button class="btn primary" onclick="SF.merchantAddCollection(\''+uid+'\')">+ Add Collection</button><span class="muted" style="font-size:11px">Maximum new collection now: '+money(c.collectionCapacity)+'</span></div>':'';modal('<div class="modalBox"><div class="modalHead"><div><b>'+esc(u.name)+'</b><div class="muted" style="font-size:12px">'+esc(u.id)+' • '+esc(u.upi||"UPI not added")+' • APK: '+esc(u.apk||u.mobile||"Not added")+'</div></div><button class="btn ghost sm" onclick="SF.close()">✕</button></div><div class="modalBody"><div class="detailKpis">'+metric("Available Collection",money(c.collectionCapacity))+metric("UPI ID",esc(u.upi||"-"))+metric("APK / Mobile",esc(u.apk||u.mobile||"-"))+'</div>'+merchantControls+'<h3>Google Pay Details</h3><div class="notice">Only operational GPay details and available collection capacity are shown here. Funding model, admin limit, deposit amounts, deposit history, commission, withdrawals, frozen funds and internal settlement data are private.</div><div class="credGrid"><div class="credBox"><span>UPI ID</span><div class="credValue"><code>'+esc(u.upi||"-")+'</code></div></div><div class="credBox"><span>APK / Mobile Number</span><div class="credValue"><code>'+esc(u.apk||u.mobile||"-")+'</code></div></div></div>'+credentialHTML(u,true)+'<h3>GPay QR Codes</h3>'+qrHTML(u,false)+'<h3>Collection History</h3>'+(es.length?es.map(function(e){var row=entryRow(e,false);if(e.type==="collection"&&currentSharedRole==="Merchant")row+='<div class="cardActions" style="margin:-8px 0 10px"><button class="btn ghost sm" onclick="SF.editCollectionAmount(\''+e.id+'\')">Edit Collection Amount</button></div>';return row}).join(""):'<div class="empty">No collection history</div>')+'</div></div>')}
function merchantAddCollection(uid){if(currentSharedRole!=="Merchant")return toast("Merchant permission required");openCollectionForm(uid,"merchant")}
function editCollectionAmount(eid){if(currentSharedRole!=="Merchant")return toast("Merchant permission required");var e=db.entries.find(function(x){return x.id===eid});if(!e||e.type!=="collection")return;modal('<div class="modalBox small"><div class="modalHead"><div><b>Edit Collection Amount</b><div class="muted" style="font-size:12px">Merchant can correct amount only.</div></div><button class="btn ghost sm" onclick="SF.close()">✕</button></div><div class="modalBody">'+field("Collection Amount","mcEdit",e.amount,"number")+'<div class="field" style="margin-top:12px"><label>Correction Note</label><input id="mcReason" placeholder="Optional reason"></div></div><div class="modalFoot"><button class="btn primary" onclick="SF.saveCollectionAmount(\''+eid+'\')">Save Correction</button></div></div>')}
function saveCollectionAmount(eid){if(currentSharedRole!=="Merchant")return toast("Merchant permission required");var e=db.entries.find(function(x){return x.id===eid}),u=db.users.find(function(x){return x.id===e.userId});if(!e||!u)return;var old=Number(e.amount||0),n=Number(v("mcEdit")||0);if(n<0)return toast("Invalid amount");var c=calc(u),maxAllowed=c.collectionCapacity+old;if(n>maxAllowed+0.0001)return toast("Corrected amount exceeds available capacity: "+money(maxAllowed));e.previousAmount=old;e.amount=n;e.updatedAt=nowIso();e.updatedBy="merchant";var reason=v("mcReason");if(reason)e.note=(e.note?e.note+" • ":"")+"Correction: "+reason;audit("collection_corrected",e.userId,"From "+money(old)+" to "+money(n),"merchant");close();save();toast("Collection amount corrected")}
function userView(tokn){currentSharedRole="User";var u=db.users.find(function(x){return x.token===tokn});if(!u)return invalid("User link is invalid or revoked.");var c=calc(u),es=entries(u.id).slice().sort(function(a,b){return String(b.date||"").localeCompare(String(a.date||""))}),ds=deposits(u.id).slice().sort(function(a,b){return String(b.createdAt||"").localeCompare(String(a.createdAt||""))});var userKpis=u.fundingMode==="deposit"?kpi("AVAILABLE BALANCE",money(c.collectionCapacity),"Available for new collection")+kpi("COLLECTED AMOUNT",money(c.collection),"Total received collection")+kpi("WITHDRAWAL AMOUNT",money(c.inrReceived),"Successfully returned INR")+kpi("PENDING FROM YOU",money(c.pending),"Collection still pending")+kpi("FROZEN",money(c.frozen),"Current blocked"):kpi("COLLECTED AMOUNT",money(c.collection),"Total collection")+kpi("WITHDRAWAL AMOUNT",money(c.inrReceived),"Successful returned INR")+kpi("PENDING FROM YOU",money(c.pending),"Current pending")+kpi("EARNED COMMISSION",money(c.commissionEarned),num(db.settings.commissionRate)+"% of successful withdrawal")+kpi("FROZEN",money(c.frozen),"Current blocked");document.getElementById("app").innerHTML='<div class="readonly"><div class="readHead"><div class="logo"><div class="logoMark">◆</div><div>'+esc(u.name)+'<div class="muted" style="font-size:11px">'+esc(u.id)+'</div></div></div><span class="badge green">● Live</span></div><div class="kpis" style="margin-top:15px">'+userKpis+'</div>'+(u.fundingMode==="deposit"?'<div class="box" style="padding:16px;margin-top:15px"><div class="toolbar"><div><h2>Create Deposit</h2><div class="muted">Add USDT to refill your available collection balance.</div></div><button class="btn green" onclick="SF.createDepositPage(\''+u.id+'\')">+ Create Deposit</button></div><div class="notice green">Deposit credit rate: <b>1 USDT = '+money(depositRate())+'</b>. Your INR withdrawals are also accepted and shown above, but they do not refill this deposit balance.</div>'+(ds.length?'<details style="margin-top:12px"><summary style="cursor:pointer;font-weight:800">My Deposit History</summary><div style="margin-top:10px">'+ds.map(function(d){return depositRow(d,false)}).join("")+'</div></details>':'')+'</div>':'<div class="notice" style="margin-top:15px">Your admin-configured maximum collection limit is private. Your dashboard shows only collection, successful withdrawals, pending amount and earned commission.</div>')+'<div class="box" style="padding:16px;margin-top:15px"><div class="toolbar"><div><h2>Your Details</h2><div class="muted">UPI, APK and GPay access</div></div><button class="btn primary" onclick="SF.userEditProfile(\''+u.id+'\')">Edit My Details</button></div><div class="credGrid"><div class="credBox"><span>UPI ID</span><div class="credValue"><code>'+esc(u.upi||"-")+'</code></div></div><div class="credBox"><span>APK Number</span><div class="credValue"><code>'+esc(u.apk||"-")+'</code></div></div></div>'+credentialHTML(u,true)+'</div><div class="box" style="padding:16px;margin-top:15px"><div class="toolbar"><div><h2>GPay QR Codes</h2><div class="muted">Upload or remove your QR codes.</div></div><button class="btn primary" onclick="SF.userUploadQR(\''+u.id+'\')">+ Upload QR Codes</button></div>'+qrHTML(u,true)+'</div><div class="box" style="padding:16px;margin-top:15px"><h2>History</h2>'+(es.length?es.map(function(e){return entryRow(e,false)}).join(""):'<div class="empty">No history yet.</div>')+'</div></div>';if(u.fundingMode==="deposit")startWatcher()}
function userEditProfile(uid){var u=db.users.find(function(x){return x.id===uid});if(!u)return;modal('<div class="modalBox"><div class="modalHead"><div><b>Edit Your Details</b><div class="muted" style="font-size:12px">Financial controls and limits remain admin-only.</div></div><button class="btn ghost sm" onclick="SF.close()">✕</button></div><div class="modalBody"><div class="form">'+field("UPI ID","selfUpi",u.upi)+field("APK Mobile Number","selfApk",u.apk)+field("Mobile Number","selfMob",u.mobile)+field("Telegram Username","selfTg",u.telegram)+field("GPay Login ID","selfGpayLogin",u.gpayLogin)+field("GPay Password","selfGpayPassword",u.gpayPassword)+'</div></div><div class="modalFoot"><button class="btn primary" onclick="SF.saveUserSelf(\''+uid+'\')">Save Details</button></div></div>')}
function saveUserSelf(uid){var u=db.users.find(function(x){return x.id===uid});if(!u)return;u.upi=v("selfUpi");u.apk=v("selfApk");u.mobile=v("selfMob");u.telegram=v("selfTg");u.gpayLogin=v("selfGpayLogin");u.gpayPassword=v("selfGpayPassword");audit("user_self_updated",uid,"Profile / GPay details updated","user");close();save();toast("Details updated")}
function userUploadQR(uid){uploadQR(uid)}
function invalid(msg){document.getElementById("app").innerHTML='<div class="readonly"><div class="box" style="padding:25px;max-width:540px;margin:80px auto"><h2>Access unavailable</h2><p class="muted">'+esc(msg)+'</p><button class="btn primary" onclick="location.hash=\'\'">Back</button></div></div>'}
function resetDemo(){if(!confirm("Reset all prototype data?"))return;localStorage.removeItem(KEY);db=load();render();toast("Prototype reset")}
